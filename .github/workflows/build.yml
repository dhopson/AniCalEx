# Tests and builds for all three systems. On a v* tag, the last job collects
# the Arch package, the macOS disk images and the Windows installer and zip
# into one draft GitHub Release; publishing it stays a manual step.
#
# - Linux: Arch container (libadwaita >= 1.8, unlike Ubuntu), tests under Xvfb, makepkg.
# - macOS: Homebrew's GTK, one build per architecture (P5), ad-hoc signed .dmg (P4).
# - Windows: MSYS2's GTK, anical-notify from python.org Python (D24), unsigned
#   per-user installer and portable zip, then the installed app is self-tested
#   and driven through the real ani-cli (Git Bash, scoop) against a fake site.
name: build

on:
  push:
    branches: [main, "port/**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  linux:
    name: linux (tests, Arch package)
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 30
    steps:
      - name: Install GTK stack and build tools
        run: >-
          pacman -Syu --noconfirm --needed git python python-gobject gtk4 libadwaita libsecret
          adwaita-icon-theme python-pytest xorg-server-xvfb base-devel
          python-build python-installer python-setuptools python-wheel
      - uses: actions/checkout@v7
      - name: pytest (under Xvfb, so the UI smoke tests run)
        run: xvfb-run -a python -m pytest -q
      - name: Arch package
        run: |
          useradd -m builder
          chown -R builder .
          su builder -c "cd packaging && makepkg --noconfirm"
          mkdir -p out
          mv packaging/*.pkg.tar.zst out/
      - uses: actions/upload-artifact@v7
        with:
          name: anical-linux
          path: out/

  macos-tests:
    name: macos (tests)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install GTK stack
        run: brew install gtk4 libadwaita pygobject3 adwaita-icon-theme
      - name: Virtualenv
        run: |
          for py in "$(brew --prefix)"/opt/python@3.*/bin/python3.[0-9]*; do
            if "$py" -c "import gi" 2>/dev/null; then PY="$py"; fi
          done
          "$PY" -m venv --system-site-packages venv
          venv/bin/pip install --quiet -e '.[dev]' --config-settings editable_mode=compat
      - name: pytest
        run: venv/bin/python -m pytest -q

  macos:
    name: macos-${{ matrix.arch }} (build)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-15 }
          - { arch: x86_64, runner: macos-15-intel }
    steps:
      - uses: actions/checkout@v7

      - name: Install GTK stack (Homebrew)
        run: brew install gtk4 libadwaita pygobject3 adwaita-icon-theme librsvg

      - name: Virtualenv with PyInstaller
        run: |
          for py in "$(brew --prefix)"/opt/python@3.*/bin/python3.[0-9]*; do
            if "$py" -c "import gi" 2>/dev/null; then PY="$py"; fi
          done
          "$PY" -m venv --system-site-packages venv
          venv/bin/pip install --quiet pyinstaller tzdata .

      - name: Icon
        run: packaging/macos/make-icns.sh "$RUNNER_TEMP/AniCal.icns"

      - name: Freeze and sign ad hoc
        env:
          ANICAL_ICNS: ${{ runner.temp }}/AniCal.icns
        run: |
          venv/bin/pyinstaller --noconfirm --log-level WARN --distpath dist --workpath build packaging/pyinstaller/anical.spec
          codesign --force --deep --sign - dist/AniCal.app
          codesign --verify --verbose dist/AniCal.app

      - name: Disk image
        run: |
          version=$(venv/bin/python -c "import anical; print(anical.__version__)")
          mkdir -p out dmg
          ditto dist/AniCal.app dmg/AniCal.app
          ln -s /Applications dmg/Applications
          hdiutil create -volname AniCal -srcfolder dmg -ov -format UDZO "out/AniCal-$version-macos-${{ matrix.arch }}.dmg"

      # Hide Homebrew so the bundle can't fall back to its libraries or data (as in S1).
      - name: Self-test, relocated with Homebrew hidden
        run: |
          ditto dist/AniCal.app "$RUNNER_TEMP/AniCal.app"
          if [ "${{ matrix.arch }}" = arm64 ]; then
            sudo mv /opt/homebrew /opt/homebrew-hidden
          else
            for dir in Cellar opt etc; do sudo mv "/usr/local/$dir" "/usr/local/$dir-hidden"; done
          fi
          /usr/bin/python3 packaging/ci/run_selftest.py out/selftest -- "$RUNNER_TEMP/AniCal.app/Contents/MacOS/AniCal"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: anical-macos-${{ matrix.arch }}
          path: out/

  windows-tests:
    name: windows (tests)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-python-pytest
            mingw-w64-ucrt-x86_64-python-tzlocal
      - name: pytest
        shell: msys2 {0}
        run: python -m pytest -q

  windows:
    name: windows-x64 (build)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-pyinstaller
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-python-certifi
            mingw-w64-ucrt-x86_64-python-tzdata
            mingw-w64-ucrt-x86_64-python-tzlocal
            mingw-w64-ucrt-x86_64-librsvg

      # python.org Python: anical-notify, the icon, and the CI scripts.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Icon
        shell: msys2 {0}
        run: rsvg-convert -w 256 -h 256 anical/data/icons/hicolor/scalable/apps/io.github.dhopson.AniCal.svg -o icon-256.png
      - name: Icon (ico)
        shell: pwsh
        run: |
          pip install --quiet pillow
          python packaging/windows/make-ico.py icon-256.png "$env:RUNNER_TEMP\AniCal.ico"

      - name: Freeze AniCal (MSYS2)
        shell: msys2 {0}
        run: |
          export ANICAL_ICO="$(cygpath -w "$RUNNER_TEMP")\\AniCal.ico"
          pyinstaller --noconfirm --log-level WARN --distpath dist --workpath build packaging/pyinstaller/anical.spec

      - name: Freeze anical-notify (python.org Python)
        shell: pwsh
        run: |
          pip install --quiet pyinstaller desktop-notifier
          pyinstaller --noconfirm --log-level WARN --distpath dist-notify --workpath build-notify packaging/windows/anical-notify.spec
          Copy-Item -Recurse dist-notify/anical-notify dist/AniCal/anical-notify

      - name: Installer and portable zip
        shell: pwsh
        run: |
          $version = (Select-String -Path anical/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          "ANICAL_VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path dist/AniCal -DestinationPath "out/AniCal-$version-windows-x64-portable.zip"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc /Q "/DAppVersion=$version" "/DIconFile=$env:RUNNER_TEMP\AniCal.ico" packaging\windows\anical.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem out | Format-Table Name, Length

      - name: Install it, the way a user would
        shell: pwsh
        run: |
          $setup = "out/AniCal-$env:ANICAL_VERSION-windows-x64-setup.exe"
          Start-Process -Wait -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=out\install.log"
          Get-ChildItem "$env:LOCALAPPDATA\Programs\AniCal" | Format-Table Name
          Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\AniCal.lnk"

      # The user's documented setup (D23): Git for Windows (preinstalled) plus scoop's ani-cli and mpv.
      - name: Install scoop, ani-cli, mpv, ffmpeg
        shell: pwsh
        run: |
          iex "& {$(irm get.scoop.sh)} -RunAsAdmin"
          $env:PATH = "$HOME\scoop\shims;$env:PATH"
          scoop bucket add extras
          scoop install ani-cli mpv ffmpeg
          "$HOME\scoop\shims" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      # Plain PowerShell: MSYS2 isn't on PATH, so the installed app has to stand on its own.
      - name: Self-test the installed app
        shell: pwsh
        env:
          ANICAL_SELFTEST_ANICLI: "1"
        run: python packaging/ci/run_selftest.py out/selftest -- "$env:LOCALAPPDATA\Programs\AniCal\AniCal.exe"

      - name: ani-cli through the installed helpers
        shell: pwsh
        run: python packaging/ci/anicli_harness.py --out out/harness --work "$env:RUNNER_TEMP\AniCal harness work" --helpers "$env:LOCALAPPDATA\Programs\AniCal"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: anical-windows-x64
          path: out/

  release:
    name: draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos-tests, macos, windows-tests, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Create the draft release with every download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(find artifacts \( -name '*.pkg.tar.zst' -o -name '*.dmg' -o -name '*-setup.exe' -o -name '*-portable.zip' \) -type f)
          echo "$files"
          gh release create "$GITHUB_REF_NAME" $files --repo "$GITHUB_REPOSITORY" --draft \
            --title "AniCal ${GITHUB_REF_NAME#v}" \
            --notes "Downloads for Linux (Arch package), macOS (Apple Silicon and Intel) and Windows x64. The macOS and Windows builds are unsigned: see the README's install sections."
