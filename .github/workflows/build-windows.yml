# Windows x64 build (P3, P5): AniCal frozen from MSYS2's GTK stack, the
# anical-notify helper from python.org Python (D24), an unsigned per-user
# installer (P4) and a portable zip. The installed app is then self-tested and
# driven through the real ani-cli (Git Bash, scoop) against a fake site.
name: build-windows

on:
  push:
    branches: [main, "port/**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  tests:
    name: tests (windows-x64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-python-pytest
            mingw-w64-ucrt-x86_64-python-tzlocal
      - name: pytest
        shell: msys2 {0}
        run: python -m pytest -q

  build:
    name: build (windows-x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-pyinstaller
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-python-certifi
            mingw-w64-ucrt-x86_64-python-tzdata
            mingw-w64-ucrt-x86_64-python-tzlocal
            mingw-w64-ucrt-x86_64-librsvg

      # python.org Python: anical-notify, the icon, and the CI scripts.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Icon
        shell: msys2 {0}
        run: rsvg-convert -w 256 -h 256 anical/data/icons/hicolor/scalable/apps/io.github.dhopson.AniCal.svg -o icon-256.png
      - name: Icon (ico)
        shell: pwsh
        run: |
          pip install --quiet pillow
          python packaging/windows/make-ico.py icon-256.png "$env:RUNNER_TEMP\AniCal.ico"

      - name: Freeze AniCal (MSYS2)
        shell: msys2 {0}
        run: |
          export ANICAL_ICO="$(cygpath -w "$RUNNER_TEMP")\\AniCal.ico"
          pyinstaller --noconfirm --log-level WARN --distpath dist --workpath build packaging/pyinstaller/anical.spec

      - name: Freeze anical-notify (python.org Python)
        shell: pwsh
        run: |
          pip install --quiet pyinstaller desktop-notifier
          pyinstaller --noconfirm --log-level WARN --distpath dist-notify --workpath build-notify packaging/windows/anical-notify.spec
          Copy-Item -Recurse dist-notify/anical-notify dist/AniCal/anical-notify

      - name: Installer and portable zip
        shell: pwsh
        run: |
          $version = (Select-String -Path anical/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          "ANICAL_VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path dist/AniCal -DestinationPath "out/AniCal-$version-windows-x64-portable.zip"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc /Q "/DAppVersion=$version" "/DIconFile=$env:RUNNER_TEMP\AniCal.ico" packaging\windows\anical.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem out | Format-Table Name, Length

      - name: Install it, the way a user would
        shell: pwsh
        run: |
          $setup = "out/AniCal-$env:ANICAL_VERSION-windows-x64-setup.exe"
          Start-Process -Wait -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=out\install.log"
          Get-ChildItem "$env:LOCALAPPDATA\Programs\AniCal" | Format-Table Name
          Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\AniCal.lnk"

      # The user's documented setup (D23): Git for Windows (preinstalled) plus scoop's ani-cli and mpv.
      - name: Install scoop, ani-cli, mpv, ffmpeg
        shell: pwsh
        run: |
          iex "& {$(irm get.scoop.sh)} -RunAsAdmin"
          $env:PATH = "$HOME\scoop\shims;$env:PATH"
          scoop bucket add extras
          scoop install ani-cli mpv ffmpeg
          "$HOME\scoop\shims" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      # Plain PowerShell: MSYS2 isn't on PATH, so the installed app has to stand on its own.
      - name: Self-test the installed app
        shell: pwsh
        env:
          ANICAL_SELFTEST_ANICLI: "1"
        run: python packaging/ci/run_selftest.py out/selftest -- "$env:LOCALAPPDATA\Programs\AniCal\AniCal.exe"

      - name: ani-cli through the installed helpers
        shell: pwsh
        run: python packaging/ci/anicli_harness.py --out out/harness --work "$env:RUNNER_TEMP\AniCal harness work" --helpers "$env:LOCALAPPDATA\Programs\AniCal"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anical-windows-x64
          path: out/
