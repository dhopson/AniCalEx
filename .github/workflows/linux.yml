# Linux: lint, tests under Xvfb in an Arch container (libadwaita >= 1.8, unlike
# Ubuntu), and the Arch package (makepkg), on every push to main and pull request.
# On a v* tag it then adds its downloads to that tag's draft GitHub Release
# (packaging/ci/release_upload.sh), which is published by hand. linux.yml,
# macos.yml and windows.yml are separate so the README can show each
# system's build status.
name: linux

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request replaces a run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  linux:
    name: linux (tests, Arch package)
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 30
    steps:
      - name: Install GTK stack and build tools
        run: >-
          pacman -Syu --noconfirm --needed git python python-gobject gtk4 libadwaita libsecret
          adwaita-icon-theme python-pytest xorg-server-xvfb base-devel
          python-build python-installer python-setuptools python-wheel ruff
      - uses: actions/checkout@v7
      - name: Lint and formatting
        run: ruff check . && ruff format --check .
      - name: pytest (under Xvfb, so the UI smoke tests run)
        run: xvfb-run -a python -m pytest -q
      - name: Arch package
        run: |
          useradd -m builder
          chown -R builder .
          su builder -c "cd packaging && makepkg --noconfirm"
          mkdir -p out
          mv packaging/*.pkg.tar.zst out/
      - uses: actions/upload-artifact@v7
        with:
          name: anical-linux
          path: out/

  release:
    name: add to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Add the downloads to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: packaging/ci/release_upload.sh "$GITHUB_REF_NAME" $(find artifacts -name '*.pkg.tar.zst' -type f)
