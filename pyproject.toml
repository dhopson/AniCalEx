[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "anical"
version = "0.1.0.dev0"
description = "Anime library and airing calendar for GNOME, with ani-cli playback"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
# PyGObject, GTK 4 and libadwaita come from the distribution (see README).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
anical = "anical.app:main"

[tool.setuptools.packages.find]
include = ["anical*"]

[tool.setuptools.package-data]
"anical.db" = ["migrations/*.sql"]
"anical.playback" = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# Raised inside PyGObject itself on Python 3.14, not by our code.
filterwarnings = ["ignore::DeprecationWarning:gi.events"]
